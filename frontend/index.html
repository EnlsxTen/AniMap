    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />

    <title>AniMap - ACG展会聚合平台</title>
    <meta name="description" content="AniMap 是 ACG 展会聚合平台，在地图上展示全国漫展、Cosplay、宅舞等二次元活动与场馆，帮你发现附近正在举办的展会和组局。" />
    <meta name="robots" content="index,follow" />
    <link rel="canonical" href="https://animap.top/" />
    <!-- Open Graph：微信 / QQ / Twitter 等分享时显示的卡片 -->
    <meta property="og:type" content="website" />

    <meta property="og:title" content="AniMap - ACG展会聚合平台" />

    <script>
      // 主题初始化（防止闪烁）
      (function () {
        try {
          var mode = localStorage.getItem('themeMode') || localStorage.getItem('theme') || 'auto';
          var hour = new Date().getHours();
          var theme = mode === 'auto' ? (hour >= 18 || hour < 6 ? 'dark' : 'light') : mode;
          if (theme === 'dark') document.documentElement.classList.add('dark');
        } catch (e) {}
      })();
    </script>
  </head>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
